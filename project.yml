name: PickWheel
options:
  bundleIdPrefix: org.sforce
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PickWheel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes: []
      - path: PickWheelApp.swift
    info:
      path: PickWheel/Info.plist
      properties:
        CFBundleDisplayName: PickWheel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        NSRemindersFullAccessUsageDescription: "PickWheel needs access to your Reminders so it can spin a wheel of your tasks and help you decide what to do next."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sforce.PickWheel

  PickWheelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PickWheelTests
    dependencies:
      - target: PickWheel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sforce.PickWheelTests

schemes:
  PickWheel:
    build:
      targets:
        PickWheel: all
        PickWheelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PickWheelTests
